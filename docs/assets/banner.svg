<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">PRism — See every contribution clearly.</title>
  <desc id="desc">A dark purple banner with a geometric prism and soft beams of colored light.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0b12"/>
      <stop offset="1" stop-color="#171326"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b8ff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#8b7cf6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#53458c" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9d83ff" stop-opacity=".6"/>
      <stop offset=".55" stop-color="#648cff" stop-opacity=".44"/>
      <stop offset="1" stop-color="#68d9d0" stop-opacity=".24"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="26" fill="url(#background)"/>
  <path d="M685 172 L934 62 L934 282 Z" fill="url(#spectrum)" opacity=".32" filter="url(#glow)"/>
  <path d="M686 170 L860 80 L860 260 Z" fill="url(#prism)" stroke="#b8a9ff" stroke-opacity=".75" stroke-width="2"/>
  <path d="M330 170 H686" stroke="#f0edff" stroke-width="3" stroke-linecap="round" opacity=".65"/>
  <path d="M860 111 L1035 70 M860 170 H1060 M860 229 L1035 270" stroke="url(#spectrum)" stroke-width="3" stroke-linecap="round" opacity=".72"/>
  <circle cx="686" cy="170" r="5" fill="#f3efff"/>
  <text x="100" y="151" fill="#f7f5ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="700" letter-spacing="-3">PRism</text>
  <text x="104" y="205" fill="#c2bad9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="450" letter-spacing=".2">See every contribution clearly.</text>
  <path d="M104 234 H252" stroke="#8b7cf6" stroke-width="4" stroke-linecap="round"/>
</svg>
